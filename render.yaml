# Render Blueprint for the Python API. In Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: origami-visual-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CORS_ORIGINS
        value: https://origamivisual.vercel.app,http://localhost:3000
      # Optional: enables photo recognition. Render asks for the value when you create the Blueprint.
      - key: ANTHROPIC_API_KEY
        sync: false
